<div class="flex h-full flex-col gap-4">

  <!-- prime flex  -->
  <!-- prime ng  -->
  <!-- Filtros -->
  <section class="rounded-xl border border-slate-200 bg-white p-5">
    <div class="mb-4 flex items-center justify-between">
      <h2 class="text-lg font-semibold text-slate-800">
        Filtros
      </h2>

      <button
        class="rounded-lg bg-emerald-800 px-4 py-2 text-sm font-medium text-white transition hover:bg-emerald-900">
        Consolidar Seleccionados
      </button>
    </div>

    <div class="grid grid-cols-1 gap-4 md:grid-cols-3">
      <div>
        <label class="mb-1 block text-sm font-medium text-slate-600">
          Identificación
        </label>
        <input type="text"
          class="w-full rounded-lg border border-slate-300 px-3 py-2 text-sm focus:border-emerald-700 focus:outline-none" />
      </div>

      <div>
        <label class="mb-1 block text-sm font-medium text-slate-600">
          Estado
        </label>
        <select
          class="w-full rounded-lg border border-slate-300 px-3 py-2 text-sm focus:border-emerald-700 focus:outline-none">
          <option>Todos</option>
        </select>
      </div>

      <div>
        <label class="mb-1 block text-sm font-medium text-slate-600">
          Fecha
        </label>
        <input type="date"
          class="w-full rounded-lg border border-slate-300 px-3 py-2 text-sm focus:border-emerald-700 focus:outline-none" />
      </div>
    </div>
  </section>

  <!-- Tabla + Detalle -->
  <div class="grid flex-1 grid-cols-12 gap-4">

    <!-- Tabla -->
    <section class="col-span-12 rounded-xl border border-slate-200 bg-white lg:col-span-8">
      <div class="border-b border-slate-200 px-5 py-4">
        <h2 class="font-semibold text-slate-800">
          Transacciones
        </h2>
      </div>

      <div class="overflow-auto">
        <table class="min-w-full text-sm">
          <thead class="bg-slate-50">
            <tr>
              <th class="px-4 py-3 text-left font-semibold text-slate-600">
                Columna 1
              </th>

              <th class="px-4 py-3 text-left font-semibold text-slate-600">
                Columna 2
              </th>

              <th class="px-4 py-3 text-left font-semibold text-slate-600">
                Columna 3
              </th>
            </tr>
          </thead>

          <tbody>
            <tr class="cursor-pointer border-t hover:bg-slate-50">
              <td class="px-4 py-3">Dato 1</td>
              <td class="px-4 py-3">Dato 2</td>
              <td class="px-4 py-3">Dato 3</td>
            </tr>
          </tbody>
        </table>
      </div>

      <div class="flex items-center justify-between border-t border-slate-200 px-5 py-3">
        <span class="text-sm text-slate-500">
          Mostrando 1 de 100 registros
        </span>

        <div class="flex gap-2">
          <button class="rounded-lg border px-3 py-1 text-sm">
            Anterior
          </button>

          <button class="rounded-lg border px-3 py-1 text-sm">
            Siguiente
          </button>
        </div>
      </div>
    </section>

    <!-- Detalle -->
    <section class="col-span-12 rounded-xl border border-slate-200 bg-white lg:col-span-4">
      <div class="border-b border-slate-200 px-5 py-4">
        <h2 class="font-semibold text-slate-800">
          Detalle
        </h2>
      </div>

      <div class="space-y-4 p-5">
        <div>
          <p class="text-xs uppercase tracking-wide text-slate-500">
            Identificación
          </p>
          <p class="mt-1 text-sm font-medium text-slate-800">
            1234567890
          </p>
        </div>

        <div>
          <p class="text-xs uppercase tracking-wide text-slate-500">
            Estado
          </p>
          <p class="mt-1 text-sm font-medium text-emerald-700">
            Procesado
          </p>
        </div>

        <div>
          <p class="text-xs uppercase tracking-wide text-slate-500">
            Fecha
          </p>
          <p class="mt-1 text-sm text-slate-800">
            10/11/2026
          </p>
        </div>

        <button
          class="w-full rounded-lg bg-emerald-800 px-4 py-2 text-sm font-medium text-white transition hover:bg-emerald-900">
          Consolidar
        </button>
      </div>
    </section>

  </div>

</div>
